<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drums Kit</title>
    <link rel="icon" href="https://img.icons8.com/?size=80&id=ZbReTGFyF9WA&format=png" />

    <!-- Daisy UI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Tailwind css CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom css -->
    <link rel="stylesheet" href="./style/styles.css">
</head>

<body class="bg-[url('/images/background.jpg')] bg-cover bg-no-repeat bg-center h-screen flex ">
    <div class="keys flex flex-1 items-center justify-center min-h-screen">
        <div data-key="65" class="key">
            <kbd>A</kbd>
            <span class="sound">clap</span>
        </div>
        <div data-key="83" class="key">
            <kbd>S</kbd>
            <span class="sound">hihat</span>
        </div>
        <div data-key="68" class="key">
            <kbd>D</kbd>
            <span class="sound">kick</span>
        </div>
        <div data-key="70" class="key">
            <kbd>F</kbd>
            <span class="sound">openhat</span>
        </div>
        <div data-key="71" class="key">
            <kbd>G</kbd>
            <span class="sound">boom</span>
        </div>
        <div data-key="72" class="key">
            <kbd>H</kbd>
            <span class="sound">ride</span>
        </div>
        <div data-key="74" class="key">
            <kbd>J</kbd>
            <span class="sound">snare</span>
        </div>
        <div data-key="75" class="key">
            <kbd>K</kbd>
            <span class="sound">tom</span>
        </div>
        <div data-key="76" class="key">
            <kbd>L</kbd>
            <span class="sound">tink</span>
        </div>
    </div>


    <audio data-key="65" src="./audio-sounds/clap.wav"></audio>
    <audio data-key="83" src="./audio-sounds/hihat.wav"></audio>
    <audio data-key="68" src="./audio-sounds/kick.wav"></audio>
    <audio data-key="70" src="./audio-sounds/openhat.wav"></audio>
    <audio data-key="71" src="./audio-sounds/boom.wav"></audio>
    <audio data-key="72" src="./audio-sounds/ride.wav"></audio>
    <audio data-key="74" src="./audio-sounds/snare.wav"></audio>
    <audio data-key="75" src="./audio-sounds/tom.wav"></audio>
    <audio data-key="76" src="./audio-sounds/tink.wav"></audio>


    <script src="./js/drums.js"></script>

</body>

</html>
